name: Spanish quality filter

on:
  workflow_run:
    workflows:
      - Scrape jobs
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  filter:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Keep Spanish-language or explicit Spanish-required jobs
        run: python scraper/spanish_quality_filter.py

      - name: Commit Spanish-quality data
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Filter Spanish-quality jobs"
          file_pattern: "docs/jobs.json scraper/data/jobs.json"
