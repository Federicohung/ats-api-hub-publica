name: Scrape jobs

on:
  schedule:
    - cron: "0 8,20 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "scraper/**"
      - ".github/workflows/scrape.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stabilize scraper runtime
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scraper/api_scraper.py')
          text = path.read_text(encoding='utf-8')

          if 'from urllib.parse import quote' not in text:
              text = text.replace(
                  'from urllib.error import URLError, HTTPError\n',
                  'from urllib.error import URLError, HTTPError\nfrom urllib.parse import quote\n',
              )

          helper = """
def posted_at_sort_value(value):
    if value is None:
        return 0
    if isinstance(value, (int, float)):
        timestamp = float(value)
        return timestamp / 1000 if timestamp > 10_000_000_000 else timestamp
    text = str(value).strip()
    if not text:
        return 0
    if text.isdigit():
        timestamp = float(text)
        return timestamp / 1000 if timestamp > 10_000_000_000 else timestamp
    try:
        normalized = text.replace('Z', '+00:00')
        return datetime.fromisoformat(normalized).timestamp()
    except ValueError:
        return 0

"""
          if 'def posted_at_sort_value(' not in text:
              text = text.replace(
                  "def make_id(source, source_id):\n",
                  helper + "def make_id(source, source_id):\n",
              )

          old_torre = "status, data = http_get(f'https://api.torre.co/opportunities/_search/?keyword={q}&remote=true&size=25&offset=0')"
          new_torre = "keyword = quote(q, safe='')\n            status, data = http_get(f'https://api.torre.co/opportunities/_search/?keyword={keyword}&remote=true&size=25&offset=0')"
          text = text.replace(old_torre, new_torre)
          text = text.replace(
              "all_jobs.sort(key=lambda j: j.get('postedAt', ''), reverse=True)",
              "all_jobs.sort(key=lambda j: posted_at_sort_value(j.get('postedAt')), reverse=True)",
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Scrape job APIs and ATS providers
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          LINKEDIN_RAPIDAPI_KEY: ${{ secrets.LINKEDIN_RAPIDAPI_KEY }}
          LINKEDIN_RAPIDAPI_HOST: ${{ vars.LINKEDIN_RAPIDAPI_HOST }}
          LINKEDIN_RAPIDAPI_PATH: ${{ vars.LINKEDIN_RAPIDAPI_PATH }}
          LINKEDIN_SEARCH_TITLES: ${{ vars.LINKEDIN_SEARCH_TITLES }}
          LINKEDIN_SEARCH_LOCATIONS: ${{ vars.LINKEDIN_SEARCH_LOCATIONS }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          SMARTRECRUITERS_API_KEY: ${{ secrets.SMARTRECRUITERS_API_KEY }}
          WORKABLE_API_KEY: ${{ secrets.WORKABLE_API_KEY }}
          TEAMTAILOR_API_KEY: ${{ secrets.TEAMTAILOR_API_KEY }}
          TEAMTAILOR_COMPANIES: ${{ vars.TEAMTAILOR_COMPANIES }}
          BREEZY_API_KEY: ${{ secrets.BREEZY_API_KEY }}
          BREEZY_COMPANIES: ${{ vars.BREEZY_COMPANIES }}
          GREENHOUSE_BOARDS: ${{ vars.GREENHOUSE_BOARDS }}
          LEVER_SITES: ${{ vars.LEVER_SITES }}
          ASHBY_BOARDS: ${{ vars.ASHBY_BOARDS }}
          SMARTRECRUITERS_COMPANIES: ${{ vars.SMARTRECRUITERS_COMPANIES }}
          WORKABLE_ACCOUNTS: ${{ vars.WORKABLE_ACCOUNTS }}
          RECRUITEE_COMPANIES: ${{ vars.RECRUITEE_COMPANIES }}
          SPANISH_SEARCH_QUERIES: ${{ vars.SPANISH_SEARCH_QUERIES }}
          SPANISH_JOB_QUERIES: ${{ vars.SPANISH_JOB_QUERIES }}
          LATAM_SPAIN_LOCATIONS: ${{ vars.LATAM_SPAIN_LOCATIONS }}
        run: |
          python scraper/api_scraper.py
          python scraper/linkedin_rapidapi_scraper.py

      - name: Commit generated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update scraped jobs"
          file_pattern: "docs/jobs.json scraper/data/jobs.json"
