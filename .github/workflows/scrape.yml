name: Scrape jobs

on:
  schedule:
    - cron: "0 8,20 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "scraper/**"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Stabilize scraper runtime
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scraper/api_scraper.py')
          text = path.read_text(encoding='utf-8')

          if 'from urllib.parse import quote, urlencode' not in text:
              if 'from urllib.parse import quote\n' in text:
                  text = text.replace('from urllib.parse import quote\n', 'from urllib.parse import quote, urlencode\n')
              else:
                  text = text.replace(
                      'from urllib.error import URLError, HTTPError\n',
                      'from urllib.error import URLError, HTTPError\nfrom urllib.parse import quote, urlencode\n',
                  )

          text = text.replace(
              "JSEARCH_KEY = os.environ.get('RAPIDAPI_KEY', '')",
              "JSEARCH_KEY = os.environ.get('JSEARCH_RAPIDAPI_KEY', '')",
          )
          text = text.replace(
              "JSearch: skipped (no RAPIDAPI_KEY)",
              "JSearch: skipped (no JSEARCH_RAPIDAPI_KEY)",
          )
          text = text.replace(
              "f'https://jsearch.p.rapidapi.com/search?query={q.replace(\" \", \"%20\")}&page=1&num_pages=1',",
              "'https://jsearch.p.rapidapi.com/search?' + urlencode({'query': q, 'page': '1', 'num_pages': '1'}),",
          )

          helper = (
              "\n"
              "def posted_at_sort_value(value):\n"
              "    if value is None:\n"
              "        return 0\n"
              "    if isinstance(value, (int, float)):\n"
              "        timestamp = float(value)\n"
              "        return timestamp / 1000 if timestamp > 10_000_000_000 else timestamp\n"
              "    text = str(value).strip()\n"
              "    if not text:\n"
              "        return 0\n"
              "    if text.isdigit():\n"
              "        timestamp = float(text)\n"
              "        return timestamp / 1000 if timestamp > 10_000_000_000 else timestamp\n"
              "    try:\n"
              "        normalized = text.replace('Z', '+00:00')\n"
              "        return datetime.fromisoformat(normalized).timestamp()\n"
              "    except ValueError:\n"
              "        return 0\n\n"
          )
          if 'def posted_at_sort_value(' not in text:
              text = text.replace(
                  "def make_id(source, source_id):\n",
                  helper + "def make_id(source, source_id):\n",
              )

          old_torre = "status, data = http_get(f'https://api.torre.co/opportunities/_search/?keyword={q}&remote=true&size=25&offset=0')"
          new_torre = "keyword = quote(q, safe='')\n            status, data = http_get(f'https://api.torre.co/opportunities/_search/?keyword={keyword}&remote=true&size=25&offset=0')"
          text = text.replace(old_torre, new_torre)
          text = text.replace(
              "all_jobs.sort(key=lambda j: j.get('postedAt', ''), reverse=True)",
              "all_jobs.sort(key=lambda j: posted_at_sort_value(j.get('postedAt')), reverse=True)",
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Scrape job APIs and ATS providers
        env:
          JSEARCH_RAPIDAPI_KEY: ${{ secrets.JSEARCH_RAPIDAPI_KEY }}
          LINKEDIN_RAPIDAPI_KEY: ${{ secrets.LINKEDIN_RAPIDAPI_KEY }}
          LINKEDIN_RAPIDAPI_HOST: ${{ vars.LINKEDIN_RAPIDAPI_HOST }}
          LINKEDIN_RAPIDAPI_PATH: ${{ vars.LINKEDIN_RAPIDAPI_PATH }}
          LINKEDIN_API2_RAPIDAPI_KEY: ${{ secrets.LINKEDIN_API2_RAPIDAPI_KEY }}
          LINKEDIN_API2_RAPIDAPI_HOST: ${{ vars.LINKEDIN_API2_RAPIDAPI_HOST }}
          LINKEDIN_API2_RAPIDAPI_PATH: ${{ vars.LINKEDIN_API2_RAPIDAPI_PATH }}
          LINKEDIN_SEARCH_TITLES: ${{ vars.LINKEDIN_SEARCH_TITLES }}
          LINKEDIN_SEARCH_LOCATIONS: ${{ vars.LINKEDIN_SEARCH_LOCATIONS }}
          INDEED12_RAPIDAPI_KEY: ${{ secrets.INDEED12_RAPIDAPI_KEY }}
          INDEED12_COMPANIES: ${{ vars.INDEED12_COMPANIES }}
          INDEED12_LOCALITIES: ${{ vars.INDEED12_LOCALITIES }}
          RSS_RAPIDAPI_KEY: ${{ secrets.RSS_RAPIDAPI_KEY }}
          RSS_JOB_COUNTRY_CODES: ${{ vars.RSS_JOB_COUNTRY_CODES }}
          RSS_JOB_HAS_SALARY: ${{ vars.RSS_JOB_HAS_SALARY }}
          RSS_JOB_MAX_REQUESTS: ${{ vars.RSS_JOB_MAX_REQUESTS }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          SMARTRECRUITERS_API_KEY: ${{ secrets.SMARTRECRUITERS_API_KEY }}
          WORKABLE_API_KEY: ${{ secrets.WORKABLE_API_KEY }}
          TEAMTAILOR_API_KEY: ${{ secrets.TEAMTAILOR_API_KEY }}
          TEAMTAILOR_COMPANIES: ${{ vars.TEAMTAILOR_COMPANIES }}
          BREEZY_API_KEY: ${{ secrets.BREEZY_API_KEY }}
          BREEZY_COMPANIES: ${{ vars.BREEZY_COMPANIES }}
          GREENHOUSE_BOARDS: ${{ vars.GREENHOUSE_BOARDS }}
          LEVER_SITES: ${{ vars.LEVER_SITES }}
          ASHBY_BOARDS: ${{ vars.ASHBY_BOARDS }}
          SMARTRECRUITERS_COMPANIES: ${{ vars.SMARTRECRUITERS_COMPANIES }}
          WORKABLE_ACCOUNTS: ${{ vars.WORKABLE_ACCOUNTS }}
          RECRUITEE_COMPANIES: ${{ vars.RECRUITEE_COMPANIES }}
          SPANISH_SEARCH_QUERIES: ${{ vars.SPANISH_SEARCH_QUERIES }}
          SPANISH_JOB_QUERIES: ${{ vars.SPANISH_JOB_QUERIES }}
          LATAM_SPAIN_LOCATIONS: ${{ vars.LATAM_SPAIN_LOCATIONS }}
        run: |
          python scraper/api_scraper.py
          python scraper/linkedin_rapidapi_scraper.py
          python scraper/indeed12_rapidapi_scraper.py
          python scraper/rss_rapidapi_scraper.py

      - name: Keep only Spanish LATAM Spain and Caribbean jobs
        run: |
          python - <<'PY'
          import json
          import re
          import unicodedata
          from datetime import datetime, timezone

          FILES = ['docs/jobs.json', 'scraper/data/jobs.json']
          LANGUAGE_TERMS = [
              'spanish', 'spanish speaking', 'spanish required', 'spanish speaker',
              'bilingual spanish', 'espanol', 'español', 'castellano', 'idioma español'
          ]
          REGION_STRONG_TERMS = [
              'latam', 'latin america', 'latinoamerica', 'latinoamérica', 'america latina',
              'américa latina', 'hispanoamerica', 'hispanoamérica', 'caribbean', 'caribe'
          ]
          REGION_FIELD_TERMS = [
              'spain', 'españa', 'madrid', 'barcelona', 'valencia', 'sevilla',
              'mexico', 'méxico', 'cdmx', 'ciudad de mexico', 'ciudad de méxico',
              'chile', 'santiago', 'colombia', 'bogota', 'bogotá', 'medellin', 'medellín',
              'argentina', 'buenos aires', 'peru', 'perú', 'lima', 'uruguay', 'montevideo',
              'ecuador', 'quito', 'guayaquil', 'costa rica', 'panama', 'panamá',
              'guatemala', 'el salvador', 'honduras', 'nicaragua', 'bolivia', 'paraguay',
              'venezuela', 'dominican republic', 'republica dominicana', 'república dominicana',
              'puerto rico', 'cuba', 'jamaica', 'haiti', 'trinidad', 'barbados', 'belize',
              'brazil', 'brasil', 'sao paulo', 'são paulo', 'rio de janeiro'
          ]

          def norm(value):
              text = unicodedata.normalize('NFKD', str(value or '').lower())
              text = ''.join(ch for ch in text if not unicodedata.combining(ch))
              return re.sub(r'[^a-z0-9]+', ' ', text).strip()

          def patterns(terms):
              return [re.compile(r'(?<![a-z0-9])' + re.escape(norm(t)) + r'(?![a-z0-9])') for t in terms]

          language_patterns = patterns(LANGUAGE_TERMS)
          strong_region_patterns = patterns(REGION_STRONG_TERMS)
          field_region_patterns = patterns(REGION_FIELD_TERMS)

          def job_text(job, include_description=True):
              parts = [
                  job.get('title', ''), job.get('company', ''), job.get('location', ''),
                  ' '.join(job.get('tags') or []),
              ]
              if include_description:
                  parts.append(job.get('description', ''))
              return norm(' '.join(parts))

          def any_match(patterns, haystack):
              return any(pattern.search(haystack) for pattern in patterns)

          def relevant(job):
              full = job_text(job, include_description=True)
              fields = job_text(job, include_description=False)
              return (
                  any_match(language_patterns, full)
                  or any_match(strong_region_patterns, full)
                  or any_match(field_region_patterns, fields)
              )

          for path in FILES:
              with open(path, 'r', encoding='utf-8') as f:
                  data = json.load(f)
              before = len(data.get('jobs') or [])
              jobs = [job for job in data.get('jobs', []) if relevant(job)]
              source_counts = {}
              cat_counts = {k: 0 for k in (data.get('categories') or {})}
              for job in jobs:
                  source = job.get('source', 'unknown')
                  source_counts[source] = source_counts.get(source, 0) + 1
                  for cat in job.get('categories') or ['general']:
                      cat_counts[cat] = cat_counts.get(cat, 0) + 1
              data['updatedAt'] = datetime.now(timezone.utc).isoformat()
              data['totalJobs'] = len(jobs)
              data['sources'] = dict(sorted(source_counts.items()))
              data['categories'] = cat_counts
              data['jobs'] = jobs
              with open(path, 'w', encoding='utf-8') as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
              print(f'{path}: kept {len(jobs)} of {before} strict Spanish/LATAM/Spain/Caribbean jobs')
          PY

      - name: Commit generated data
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update scraped jobs"
          file_pattern: "docs/jobs.json scraper/data/jobs.json"
